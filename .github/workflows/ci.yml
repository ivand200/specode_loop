name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check --output-format=github .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Run deterministic test suite
        run: uv run --locked pytest

  required:
    name: CI / required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - quality
      - tests
    if: ${{ always() }}
    steps:
      - name: Require successful validation
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
